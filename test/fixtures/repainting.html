<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Repainting Fixture</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; color: #1c1c1c; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    [data-repaint-target] { border: 1px dashed #cfd6e0; padding: 0.75rem; }
    p { margin: 0 0 1rem; }
    p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <!--
    A page that re-renders itself on a knob the test controls. This is the
    stand-in for Steady Thread's two-second polling Turbo frame, which is the
    walk that broke the earlier design.

    Two independent repaint targets, so a test can point the engine at one
    subtree and assert the other is untouched:

      [data-repaint-target="live"]     the frame under test
      [data-repaint-target="sidebar"]  a second subtree

    The engine's target selector, flavor, interval, and protection mode are all
    set from the test through window.__lahe.fixture.configure(). See
    test/helpers/repaint.js.
  -->
  <h1 id="page-title">Roster</h1>

  <div id="live-frame" data-repaint-target="live">
    <h2 id="live-heading">This week</h2>
    <p id="live-note" data-region="live-note">Marcus is running four easy miles on Tuesday and resting completely on Wednesday.</p>
    <p id="live-second" data-region="live-second">Dana moved her long run to Saturday because of the weather.</p>
  </div>

  <div id="sidebar-frame" data-repaint-target="sidebar">
    <h2 id="sidebar-heading">Reminders</h2>
    <p id="sidebar-note" data-region="sidebar-note">Two clients have not accepted the invite yet.</p>
  </div>

  <div id="static-frame">
    <h2 id="static-heading">Notes</h2>
    <p id="static-note" data-region="static-note">This block is outside every repaint target and never re-renders.</p>
  </div>

  <script src="/assets/harness-stub.js"></script>
  <script src="/assets/repaint-engine.js"></script>
</body>
</html>
