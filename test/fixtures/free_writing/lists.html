<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lists fixture</title>
<style>
  body { font-family: Georgia, serif; font-size: 16px; line-height: 1.6; color: #222; max-width: 680px; margin: 40px auto; }
  ul { padding-left: 28px; margin: 0 0 20px; }
  td { border: 1px solid #ccc; padding: 4px 8px; }
</style>
</head>
<body>
<article id="post">
  <p id="intro">Two lists and a table.</p>
  <ul id="nested">
    <li id="outer-1">Plan the week
      <ul id="inner">
        <li id="inner-1">Pick the long run day</li>
        <li id="inner-2">Pick the rest day</li>
      </ul>
    </li>
    <li id="outer-2">Run the week</li>
  </ul>
  <ul id="lone">
    <li id="lone-outer">Stretch
      <ul id="lone-inner"><li id="lone-sub">Hamstrings only</li></ul>
    </li>
    <li id="lone-other">Sleep</li>
  </ul>
  <table id="grid"><tbody><tr><td id="cell">One cell of a table</td></tr></tbody></table>
</article>
</body>
</html>
