<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Host spike blog fixture</title>
<style>
  body { font-family: Georgia, serif; font-size: 16px; line-height: 1.6; color: #222; max-width: 680px; margin: 40px auto; }
  h1 { font-size: 40px; font-family: Arial, sans-serif; margin: 0 0 12px; }
  h2 { font-size: 28px; font-family: Arial, sans-serif; margin: 32px 0 8px; }
  p { margin: 0; }
  /* The child and sibling selectors the spike watches. */
  article > p { font-size: 18px; margin: 0 0 20px; }
  p + p { margin-top: 6px; }
  h2 + p { font-size: 21px; }
  p:last-child { margin-bottom: 0; }
  ul { padding-left: 28px; margin: 0 0 20px; }
  strong { color: #9f1239; }
</style>
</head>
<body>
<article id="post">
  <h1 id="title">The quiet week</h1>
  <p id="p1">Most weeks look busy from the outside. This one did not.</p>
  <h2 id="h2">What changed</h2>
  <p id="p2">We stopped <strong>measuring motion</strong> and started measuring outcomes.</p>
  <ul id="list">
    <li>Fewer meetings</li>
    <li>Longer blocks</li>
  </ul>
</article>
</body>
</html>
