<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Attacker Origin Fixture</title>
</head>
<body>
  <!--
    A page on a second origin. Served by test/helpers/servers.js on its own port,
    which is what makes it genuinely cross-origin rather than a same-origin test
    wearing a hat.

    It offers the three shapes an attacker actually has, because CORS hides the
    response and not the effect (architecture D9):

      simplePost   a POST with a simple content type. No preflight is sent, so
                   the request reaches the handler. This is the one that matters.
      beacon       navigator.sendBeacon, same story, and it survives the page.
      corsPost     a POST with JSON plus a custom header, which forces a
                   preflight. The service should refuse the preflight.

    Every one of these must be asserted on EFFECT: the event log has no new
    entries and the review files are unchanged. A status code proves nothing,
    because the attacker cannot read it either.
  -->
  <h1 id="attacker-title">Not your app</h1>
  <p id="attacker-status">Idle.</p>

  <script>
    (function () {
      function record(name, value) {
        document.getElementById("attacker-status").textContent = name + ": " + value;
        return value;
      }

      window.__attack = {
        async simplePost(url, body) {
          try {
            await fetch(url, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify(body || { forged: true })
            });
            return record("simplePost", "sent");
          } catch (err) {
            return record("simplePost", "threw:" + err.name);
          }
        },

        beacon(url, body) {
          const blob = new Blob([JSON.stringify(body || { forged: true })], { type: "text/plain" });
          const ok = navigator.sendBeacon(url, blob);
          return record("beacon", String(ok));
        },

        async corsPost(url, body, token) {
          try {
            const res = await fetch(url, {
              method: "POST",
              mode: "cors",
              headers: {
                "Content-Type": "application/json",
                "x-lahe-token": token || "guessed-token",
                "x-lahe-request": "1"
              },
              body: JSON.stringify(body || { forged: true })
            });
            return record("corsPost", "status:" + res.status);
          } catch (err) {
            return record("corsPost", "threw:" + err.name);
          }
        },

        // The READ shapes. "Cannot be driven from outside" is not only about
        // writing: a page that could READ a review's feedback back off the
        // helper has driven it just as surely (D9). These two mirror the write
        // probes for the read routes (review.read, replies.poll).
        //
        //   simpleGet  a no-cors GET. It carries no custom header (a no-cors
        //              request cannot set one), so it reaches the handler and is
        //              refused there, and the response is opaque: the attacker
        //              cannot read a byte of the body even if the helper answered.
        //   corsGet    a GET with the custom header, which forces a preflight the
        //              helper refuses for an unregistered origin, so the fetch
        //              throws before any body is seen.
        //
        // Both return what the attacker actually RECEIVED, which is what the test
        // asserts on: nothing readable.
        async simpleGet(url) {
          try {
            const res = await fetch(url, { method: "GET", mode: "no-cors" });
            let body = "";
            try {
              body = await res.text();
            } catch (readErr) {
              body = "unreadable:" + readErr.name;
            }
            return record("simpleGet", "type:" + res.type + " body:" + body);
          } catch (err) {
            return record("simpleGet", "threw:" + err.name);
          }
        },

        async corsGet(url, token) {
          try {
            const res = await fetch(url, {
              method: "GET",
              mode: "cors",
              headers: {
                "x-lahe-client": "layer",
                "x-lahe-token": token || "guessed-token"
              }
            });
            let body = "";
            try {
              body = await res.text();
            } catch (readErr) {
              body = "unreadable:" + readErr.name;
            }
            return record("corsGet", "status:" + res.status + " body:" + body);
          } catch (err) {
            return record("corsGet", "threw:" + err.name);
          }
        }
      };
    })();
  </script>
</body>
</html>
