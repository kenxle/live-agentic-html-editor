<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zoom fixture</title>
<script>
  // ?dark gives the same page on a dark background, so the layer samples a dark scheme.
  if (location.search.indexOf("dark") !== -1) document.documentElement.className = "dark";
</script>
<style>
  body { background: #fbfaf7; color: #1d1d1f; font: 17px/1.6 Georgia, serif; max-width: 680px; margin: 40px auto; }
  html.dark body { background: #16181d; color: #e6e6e6; }
  h1, h2 { font-family: Arial, sans-serif; }
  .mermaid svg { max-width: 100%; height: auto; display: block; }
  #big { width: 100%; height: auto; display: block; }
  figure { margin: 24px 0; }
  #hidden-svg { display: none; }
</style>
</head>
<body>
<main>

  </figure>
  <p id="p2">Below is a large image the document style shrinks to the page width.</p>
  <figure><img id="big" src="big.svg" alt="Hills at dusk"></figure>
  <p id="p3">A small icon in a line of text gets no button: <img id="icon" src="icon.svg" width="32" height="32" alt="icon">.</p>
  <figure><a id="photolink" href="#linked"><img id="photo" src="photo.svg" width="480" height="320" alt="A linked photo"></a></figure>
  <figure>
    <svg id="outer" xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
      <rect width="400" height="200" fill="#efe7da"/>
      <svg id="inner" x="20" y="20" width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="70" fill="#3c56a5"/>
      </svg>
      <text x="220" y="105" font-family="Arial" font-size="18" fill="#333">nested svg</text>
    </svg>
  </figure>
  <svg id="hidden-svg" width="600" height="400" viewBox="0 0 600 400"><rect width="600" height="400"/></svg>
  <p id="linked">The end of the page, where the photo's link points.</p>
</main>

</html>
