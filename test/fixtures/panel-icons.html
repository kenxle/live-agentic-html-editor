<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Panel icon regression</title>
<style>
body { font: 18px system-ui; margin: 40px; max-width: 800px; }
.panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.panel { border: 1px solid #ddd; padding: 20px; }
.ic svg { width: 48px; height: 48px; }
</style>
<body>
<section>
<h2>Ways to grow</h2>
<div class="panels">
<div class="panel"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 18 8 10 14 15 23 6"></polyline></svg></div><h4>AI adoption</h4><p>Tools are changing.</p></div>
<div class="panel"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></div><h4>Hybrid delivery</h4><p>Reach more people.</p></div>
<div class="panel"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v14H8l-5 4z"></path></svg></div><h4>Client expectations</h4><p>Support throughout the week.</p></div>
</div>
</section>
</body>
</html>
