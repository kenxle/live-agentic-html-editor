name: flake-stress

# Temporary: a hand-fired stress run for the two CI flakes on ci/flakes.
# Delete before the branch merges.
on:
  # workflow_dispatch needs the file on the default branch, which it is not, so
  # the branch pushes are the trigger while this branch is alive.
  push:
    branches: [ci/flakes]
  workflow_dispatch:
    inputs:
      unit_repeats:
        description: "How many times to run test/unit/add_command.test.js"
        default: "40"
      deck_repeats:
        description: "playwright --repeat-each for reveal_deck.spec.js"
        default: "20"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The WHOLE unit suite, the way the gate runs it. node --test puts every
      # file in its own process at once, so add_command.test.js runs under the
      # CPU contention it has on the gate, and the flake is a timing one.
      - name: repeat the unit suite
        run: |
          fails=0
          for i in $(seq 1 ${{ github.event.inputs.unit_repeats || '40' }}); do
            echo "::group::unit suite run $i"
            npm run test:unit || fails=$((fails+1))
            echo "::endgroup::"
          done
          echo "failed runs: $fails"
          test "$fails" -eq 0

  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test test/browser/reveal_deck.spec.js --repeat-each=${{ github.event.inputs.deck_repeats || '20' }}
