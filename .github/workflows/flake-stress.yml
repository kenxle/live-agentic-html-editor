name: flake-stress

# TEMPORARY. Runs the keep-mine spec sixty times over on CI boxes to reproduce a
# flake that only shows on Linux, and prints the probe's timeline when one of
# them fails. Deleted when the flake is fixed.
#
# No synthetic load: the runner is already the slow box the flake wants, and an
# earlier attempt that pinned every core with busy loops only made every test
# crawl toward its own timeout.
on:
  push:
    branches: [ci/keep-mine]
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: keep-mine, twenty times
        run: npx playwright test test/browser/keep_mine_live_page.spec.js --repeat-each=20 --workers=4
