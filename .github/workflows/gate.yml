name: gate

# main and pull requests only. A push to a working branch used to run this too,
# which meant every checkpoint on a branch mailed the pusher a failure for work
# that was not finished yet; the pull request is where a branch gets its gate.
on:
  push:
    branches: [main]
    # A docs-only push has nothing for the gate to prove, and every flake it
    # trips is an email. Code paths still run the whole gate.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude-commit*"
  pull_request:
    # Same rule for a pull request: a push of docs only (a progress page, a
    # README line) proves nothing and every red run is an email to Ken.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude-commit*"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20, not the tool's own floor of 18.2, to match .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm ci, on purpose. The tool has no runtime dependencies and these
      # checks need none, so this run also proves a fresh clone works with no
      # install step on a clean Linux machine. That is what only CI can prove.
      #
      # The browser suite is NOT run here. It runs locally with `npm run gate`
      # before a pull request and again on main after a merge; the PR body
      # states the local result. On GitHub's small runner it took 14.3
      # minutes on 2026-10-11 and was the same command we already run locally.
      - run: npm run lint
      - run: npm run check:layer
      - run: npm run test:unit
