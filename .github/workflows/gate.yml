name: gate

# main and pull requests only. A push to a working branch used to run this too,
# which meant every checkpoint on a branch mailed the pusher a failure for work
# that was not finished yet; the pull request is where a branch gets its gate.
on:
  push:
    branches: [main]
    # A docs-only push has nothing for the gate to prove, and every flake it
    # trips is an email. Code paths still run the whole gate.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude-commit*"
  pull_request:
    # Same rule for a pull request: a push of docs only (a progress page, a
    # README line) proves nothing and every red run is an email to Ken.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude-commit*"

# The job only reads the code. A token that can write, left in the checkout's
# git config, is one a compromised dev dependency could use.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node 24, the line .nvmrc names. The tool's own floor is 24.12.0, and
      # setup-node resolves "24" to the newest 24.x, which is above it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Proof that a fresh clone runs with no install step. The tool has no
      # runtime dependencies, so this runs before anything is installed, on a
      # clean Linux machine. That is what only CI can prove.
      - run: node bin/lahe.js --help

      # The dev tools (TypeScript, ESLint) come after that proof. npm run lint
      # runs tsc and ESLint, and the unit suite checks the gate rules with them.
      - run: npm ci

      # The browser suite is NOT run here. It runs locally with `npm run gate`
      # at each checkpoint; the PR body states the local result. On GitHub's
      # small runner it took 14.3 minutes on 2026-10-11 and was the same
      # command we already run locally.
      - run: npm run lint
      - run: npm run check:layer
      - run: npm run test:unit
